<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050914">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="XuperTV"><title>XuperTV · VIDAA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">X</span><span>XUPER<span class="accent">TV</span></span></div>
    <nav id="nav">
      <button data-view="home" class="nav active"><b>⌂</b><span>Inicio</span></button>
      <button data-view="live" class="nav"><b>◉</b><span>TV en vivo</span></button>
      <button data-view="movies" class="nav"><b>▣</b><span>Películas</span></button>
      <button data-view="series" class="nav"><b>▤</b><span>Series</span></button>
      <button data-view="kids" class="nav"><b>☆</b><span>Infantil</span></button>
      <button data-view="anime" class="nav"><b>✦</b><span>Anime</span></button>
      <button data-view="favorites" class="nav"><b>♥</b><span>Favoritos</span></button>
      <button data-view="history" class="nav"><b>◷</b><span>Historial</span></button>
      <button data-view="search" class="nav"><b>⌕</b><span>Buscar</span></button>
      <button data-view="settings" class="nav"><b>⚙</b><span>Ajustes</span></button>
    </nav>
    <div class="side-foot">VIDAA · HTML5</div>
  </aside>
  <main>
    <header><div class="crumb" id="crumb">INICIO</div><div class="header-right"><span id="clock"></span><span class="status-dot"></span></div></header>
    <section id="screen" tabindex="-1"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="detail" id="detail"></div></div>
<div id="player" class="player hidden">
  <video id="video" controls playsinline></video>
  <div class="player-overlay"><button id="closePlayer">✕ Cerrar</button><div id="playerTitle"></div><div id="playerMsg"></div></div>
</div>
<div id="toast" class="toast"></div>
<script src="vidaa-bridge.js"></script>
<script src="app.js"></script>
</body></html>
